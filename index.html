<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#180d20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon-v2.png">
<title>Baht → Franken</title>
<style>
/* Amy Supreme: neon damask glass edition */

:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b030a;color:#fff0fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#4b092d 0,#230719 42%,#090309 100%)}
main{width:min(100%,440px);padding:28px 23px 24px;border:1px solid #fa4ca89e;border-radius:28px;background:linear-gradient(155deg,#290b22f2,#130715f7);box-shadow:0 0 30px #ff00802c,0 24px 80px #000b;position:relative;overflow:hidden}
.brand{color:#ff8ccf;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}h1{font-family:Georgia,serif;font-size:27px;margin:10px 0 5px;color:#ffe3f5;text-shadow:0 0 15px #ff008078}.sub{color:#d6acc7;font-size:14px;margin:0 0 28px}
label{display:block;color:#f1c5df;font-size:13px;margin:0 0 8px}.field{background:#160918;border:1px solid #a7447f;border-radius:15px;padding:15px 16px;display:flex;align-items:center;gap:10px}
input{width:100%;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:27px;font-weight:650;font-variant-numeric:tabular-nums}input::-webkit-inner-spin-button{display:none}.currency{font-size:14px;color:#ff9cdb;font-weight:700}
.result{margin-top:16px;padding:20px 17px;border-radius:18px;background:linear-gradient(135deg,#5b103e,#2b0b2a);border:1px solid #fc68b89c;box-shadow:inset 0 1px 0 #ffb8e233,0 0 23px #ff00802b}
.result small{color:#ffbde3}.amount{font-size:38px;font-weight:750;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}.amount span{font-size:17px;color:#e1b8ef}
.presets{display:flex;gap:8px;margin:16px 0 25px}.presets button{flex:1;border:1px solid #ba5a9a;background:linear-gradient(180deg,#4b173c,#250c25);color:#ffeaf6;border-radius:11px;padding:10px 3px;font-weight:650}
.ratebox{border-top:1px solid #60466a;padding-top:19px}.ratehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.ratehead label{margin:0}.rateinput{padding:10px 12px}.rateinput input{font-size:17px}.status{font-size:12px;color:#bba9c2;margin-top:10px;min-height:18px}.refresh{background:none;border:0;color:#ff92d0;text-decoration:underline;padding:0;font-size:12px}
footer{font-size:11px;color:#b996ae;text-align:center;margin-top:23px;line-height:1.5}
main:before{content:'❖';position:absolute;right:23px;top:17px;font-size:18px;color:#ffb8e4;text-shadow:0 0 12px #ff1a9a}main:after{content:'';pointer-events:none;position:absolute;inset:0;opacity:.09;background:repeating-radial-gradient(ellipse at 50% 0%,transparent 0 25px,#ed4598 26px 27px,transparent 28px 58px)}main>*{position:relative;z-index:1}.brand:before{content:'✧ ';color:#ff69bb}.amount{text-shadow:0 0 14px #ff2e9d66}.presets button:active{transform:scale(.96);background:#6e2150}input:focus{filter:drop-shadow(0 0 5px #ff329a66)}
main{background-image:radial-gradient(ellipse at 50% -20%,#5a1039a8,transparent 55%),repeating-linear-gradient(45deg,transparent 0 34px,#ff25820b 35px 36px,transparent 37px 70px),linear-gradient(155deg,#290b22f2,#130715f7)}
main:after{content:'';position:absolute;inset:10px;border:1px solid #ff69b555;border-radius:22px;pointer-events:none;background:none;opacity:1}
.brand{text-align:center;letter-spacing:.24em}.brand:after{content:' ✧';color:#ff69bb}
h1{text-align:center}.sub{text-align:center}.result{position:relative}.result:before,.result:after{content:'❧';position:absolute;top:8px;color:#ff8ecf;font-size:20px;text-shadow:0 0 9px #ff0a8d}.result:before{left:12px}.result:after{right:12px;transform:scaleX(-1)}
.ratebox{border-top:1px solid #db589f}.field:focus-within{border-color:#ff92ce;box-shadow:0 0 13px #ff008044}
</style></head>
<body><main>
<div class="brand">✦ Währungsrechner ✦</div><h1>Baht &amp; Franken</h1><p class="sub">Thai Baht ↔ Schweizer Franken</p>
<label for="thb">Betrag in Thai Baht</label><div class="field"><input id="thb" type="number" inputmode="decimal" min="0" step="any" value="1000"><span class="currency">THB</span></div>
<div class="result"><small>Dein Betrag in Schweizer Franken</small><div class="amount" id="chf">– <span>CHF</span></div></div>
<div class="presets"><button data-v="100">100</button><button data-v="500">500</button><button data-v="1000">1’000</button><button data-v="5000">5’000</button></div>
<div class="ratebox"><div class="ratehead"><label for="rate">Wechselkurs (1 THB in CHF)</label><button class="refresh" id="refresh">Kurs aktualisieren</button></div>
<div class="field rateinput"><input id="rate" type="number" inputmode="decimal" step="any" value="0.024"><span class="currency">CHF</span></div>
<div class="status" id="status" aria-live="polite">Starte…</div></div>
<footer>Referenzkurs automatisch laden · Kurs manuell anpassbar<br>Der angezeigte Kurs ist ein Richtwert, Bankgebühren können abweichen.</footer>
</main>
<script>
const amount=document.querySelector('#thb'), rate=document.querySelector('#rate'), output=document.querySelector('#chf'), status=document.querySelector('#status');
const fmt=new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){const a=Number(amount.value),r=Number(rate.value);output.innerHTML=(Number.isFinite(a)&&Number.isFinite(r)&&r>0?fmt.format(a*r):'–')+' <span>CHF</span>'}
amount.addEventListener('input',calc);rate.addEventListener('input',()=>{calc();localStorage.setItem('manualRate',rate.value)});
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{amount.value=b.dataset.v;calc()}));
async function updateRate(){status.textContent='Lade aktuellen Referenzkurs…';try{const res=await fetch('https://api.frankfurter.dev/v1/latest?base=THB&symbols=CHF',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const r=data.rates.CHF;if(!(r>0))throw Error('Kurs fehlt');rate.value=String(r);localStorage.setItem('cachedRate',String(r));localStorage.setItem('cachedDate',data.date);localStorage.removeItem('manualRate');status.textContent='Aktueller Referenzkurs vom '+data.date;calc()}catch(e){const cached=localStorage.getItem('cachedRate');if(cached&&!localStorage.getItem('manualRate'))rate.value=cached;status.textContent=localStorage.getItem('manualRate')?'Manuell eingestellter Kurs aktiv.':'Offline: gespeicherter Kurs vom '+(localStorage.getItem('cachedDate')||'letzten Abruf')+'.';calc()}}
const manual=localStorage.getItem('manualRate');if(manual)rate.value=manual;calc();updateRate();document.querySelector('#refresh').addEventListener('click',updateRate);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
