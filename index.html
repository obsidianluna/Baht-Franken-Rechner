<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#180d20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>Baht → Franken</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#130b19;color:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#482052 0,#211329 42%,#100a15 100%)}
main{width:min(100%,440px);padding:28px 23px 24px;border:1px solid #75477d88;border-radius:28px;background:#211529eF;box-shadow:0 24px 80px #0008}
.brand{color:#d5a5e7;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}h1{font-size:28px;margin:10px 0 5px}.sub{color:#c7b8cc;font-size:14px;margin:0 0 28px}
label{display:block;color:#d7c7dc;font-size:13px;margin:0 0 8px}.field{background:#130d19;border:1px solid #63436a;border-radius:15px;padding:15px 16px;display:flex;align-items:center;gap:10px}
input{width:100%;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:27px;font-weight:650;font-variant-numeric:tabular-nums}input::-webkit-inner-spin-button{display:none}.currency{font-size:14px;color:#d4a8e4;font-weight:700}
.result{margin-top:16px;padding:20px 17px;border-radius:18px;background:linear-gradient(135deg,#492455,#30203b);border:1px solid #9c68a866}
.result small{color:#dec6e7}.amount{font-size:38px;font-weight:750;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}.amount span{font-size:17px;color:#e1b8ef}
.presets{display:flex;gap:8px;margin:16px 0 25px}.presets button{flex:1;border:1px solid #684a70;background:#2c1d34;color:#f5e9f8;border-radius:11px;padding:10px 3px;font-weight:650}
.ratebox{border-top:1px solid #60466a;padding-top:19px}.ratehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.ratehead label{margin:0}.rateinput{padding:10px 12px}.rateinput input{font-size:17px}.status{font-size:12px;color:#bba9c2;margin-top:10px;min-height:18px}.refresh{background:none;border:0;color:#e0b2f0;text-decoration:underline;padding:0;font-size:12px}
footer{font-size:11px;color:#9d8ca5;text-align:center;margin-top:23px;line-height:1.5}
</style></head>
<body><main>
<div class="brand">Währungsrechner</div><h1>Thai Baht → Schweizer Franken</h1><p class="sub">Schnell umrechnen, auch ohne Internet.</p>
<label for="thb">Betrag in Thai Baht</label><div class="field"><input id="thb" type="number" inputmode="decimal" min="0" step="any" value="1000"><span class="currency">THB</span></div>
<div class="result"><small>Entspricht ungefähr</small><div class="amount" id="chf">– <span>CHF</span></div></div>
<div class="presets"><button data-v="100">100</button><button data-v="500">500</button><button data-v="1000">1’000</button><button data-v="5000">5’000</button></div>
<div class="ratebox"><div class="ratehead"><label for="rate">Wechselkurs (1 THB in CHF)</label><button class="refresh" id="refresh">Kurs aktualisieren</button></div>
<div class="field rateinput"><input id="rate" type="number" inputmode="decimal" step="any" value="0.024"><span class="currency">CHF</span></div>
<div class="status" id="status" aria-live="polite">Starte…</div></div>
<footer>Referenzkurs automatisch laden · Kurs manuell anpassbar<br>Der angezeigte Kurs ist ein Richtwert, Bankgebühren können abweichen.</footer>
</main>
<script>
const amount=document.querySelector('#thb'), rate=document.querySelector('#rate'), output=document.querySelector('#chf'), status=document.querySelector('#status');
const fmt=new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){const a=Number(amount.value),r=Number(rate.value);output.innerHTML=(Number.isFinite(a)&&Number.isFinite(r)&&r>0?fmt.format(a*r):'–')+' <span>CHF</span>'}
amount.addEventListener('input',calc);rate.addEventListener('input',()=>{calc();localStorage.setItem('manualRate',rate.value)});
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{amount.value=b.dataset.v;calc()}));
async function updateRate(){status.textContent='Lade aktuellen Referenzkurs…';try{const res=await fetch('https://api.frankfurter.dev/v1/latest?base=THB&symbols=CHF',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const r=data.rates.CHF;if(!(r>0))throw Error('Kurs fehlt');rate.value=String(r);localStorage.setItem('cachedRate',String(r));localStorage.setItem('cachedDate',data.date);localStorage.removeItem('manualRate');status.textContent='Aktueller Referenzkurs vom '+data.date;calc()}catch(e){const cached=localStorage.getItem('cachedRate');if(cached&&!localStorage.getItem('manualRate'))rate.value=cached;status.textContent=localStorage.getItem('manualRate')?'Manuell eingestellter Kurs aktiv.':'Offline: gespeicherter Kurs vom '+(localStorage.getItem('cachedDate')||'letzten Abruf')+'.';calc()}}
const manual=localStorage.getItem('manualRate');if(manual)rate.value=manual;calc();updateRate();document.querySelector('#refresh').addEventListener('click',updateRate);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
