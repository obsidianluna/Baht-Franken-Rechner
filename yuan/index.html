<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#180d20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>Yuan → Franken</title>
<style>
/* Ornamental glass edition */

:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030b19;color:#fff0fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#113d83 0,#092350 42%,#030b18 100%)}
main{width:min(100%,440px);padding:28px 23px 24px;border:1px solid #4a9bff9e;border-radius:28px;background:linear-gradient(155deg,#122f65f2,#071b39f7);box-shadow:0 0 30px #1687ff2c,0 24px 80px #000b;position:relative;overflow:hidden}
.brand{color:#89c8ff;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}h1{font-family:Georgia,serif;font-size:27px;margin:10px 0 5px;color:#e4f2ff;text-shadow:0 0 15px #1687ff78}.sub{color:#adc8e7;font-size:14px;margin:0 0 28px}
label{display:block;color:#c6ddff;font-size:13px;margin:0 0 8px}.field{background:#091c3b;border:1px solid #367bc4;border-radius:15px;padding:15px 16px;display:flex;align-items:center;gap:10px}
input{width:100%;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:27px;font-weight:650;font-variant-numeric:tabular-nums}input::-webkit-inner-spin-button{display:none}.currency{font-size:14px;color:#8ecaff;font-weight:700}
.result{margin-top:16px;padding:20px 17px;border-radius:18px;background:linear-gradient(135deg,#164f9e,#0a2c61);border:1px solid #5cb6ff9c;box-shadow:inset 0 1px 0 #ffb8e233,0 0 23px #1687ff2b}
.result small{color:#c0e4ff}.amount{font-size:38px;font-weight:750;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}.amount span{font-size:17px;color:#b8d8ff}
.presets{display:flex;gap:8px;margin:16px 0 25px}.presets button{flex:1;border:1px solid #397dca;background:linear-gradient(180deg,#1b4f93,#0c2b59);color:#edf6ff;border-radius:11px;padding:10px 3px;font-weight:650}
.ratebox{border-top:1px solid #355c93;padding-top:19px}.ratehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.ratehead label{margin:0}.rateinput{padding:10px 12px}.rateinput input{font-size:17px}.status{font-size:12px;color:#b3c5e0;margin-top:10px;min-height:18px}.refresh{background:none;border:0;color:#83c6ff;text-decoration:underline;padding:0;font-size:12px}
footer{font-size:11px;color:#9db7d8;text-align:center;margin-top:23px;line-height:1.5}
main:before{content:'❖';position:absolute;right:23px;top:17px;font-size:18px;color:#b9dcff;text-shadow:0 0 12px #3b9dff}main:after{content:'';pointer-events:none;position:absolute;inset:0;opacity:.09;background:repeating-radial-gradient(ellipse at 50% 0%,transparent 0 25px,#3479c9 26px 27px,transparent 28px 58px)}main>*{position:relative;z-index:1}.brand:before{content:'✧ ';color:#ff69bb}.amount{text-shadow:0 0 14px #3b9bff66}.presets button:active{transform:scale(.96);background:#2560a9}input:focus{filter:drop-shadow(0 0 5px #3a9cff66)}
main{background-image:radial-gradient(ellipse at 50% -20%,#5a1039a8,transparent 55%),repeating-linear-gradient(45deg,transparent 0 34px,#338bea0b 35px 36px,transparent 37px 70px),linear-gradient(155deg,#122f65f2,#071b39f7)}
main:after{content:'';position:absolute;inset:10px;border:1px solid #69b5ff55;border-radius:22px;pointer-events:none;background:none;opacity:1}
.brand{text-align:center;letter-spacing:.24em}.brand:after{content:' ✧';color:#ff69bb}
h1{text-align:center}.sub{text-align:center}.result{position:relative}.result:before,.result:after{content:'❧';position:absolute;top:8px;color:#a6d7ff;font-size:20px;text-shadow:0 0 9px #1d93ff}.result:before{left:12px}.result:after{right:12px;transform:scaleX(-1)}
.ratebox{border-top:1px solid #4c99d8}.field:focus-within{border-color:#8fcfff;box-shadow:0 0 13px #1687ff44}
</style></head>
<body><main>
<div class="brand">✦ Währungsrechner ✦</div><h1>Yuan &amp; Franken</h1><p class="sub">Chinesische Yuan ↔ Schweizer Franken</p>
<label for="cny">Betrag in Chinesischen Yuan</label><div class="field"><input id="cny" type="number" inputmode="decimal" min="0" step="any" value="100"><span class="currency">CNY</span></div>
<div class="result"><small>Dein Betrag in Schweizer Franken</small><div class="amount" id="chf">– <span>CHF</span></div></div>
<div class="presets"><button data-v="10">10</button><button data-v="50">50</button><button data-v="100">100</button><button data-v="500">500</button></div>
<div class="ratebox"><div class="ratehead"><label for="rate">Wechselkurs (1 CNY in CHF)</label><button class="refresh" id="refresh">Kurs aktualisieren</button></div>
<div class="field rateinput"><input id="rate" type="number" inputmode="decimal" step="any" value="0.11"><span class="currency">CHF</span></div>
<div class="status" id="status" aria-live="polite">Starte…</div></div>
<footer>Referenzkurs automatisch laden · Kurs manuell anpassbar<br>Der angezeigte Kurs ist ein Richtwert, Bankgebühren können abweichen.</footer>
</main>
<script>
const amount=document.querySelector('#cny'), rate=document.querySelector('#rate'), output=document.querySelector('#chf'), status=document.querySelector('#status');
const fmt=new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){const a=Number(amount.value),r=Number(rate.value);output.innerHTML=(Number.isFinite(a)&&Number.isFinite(r)&&r>0?fmt.format(a*r):'–')+' <span>CHF</span>'}
amount.addEventListener('input',calc);rate.addEventListener('input',()=>{calc();localStorage.setItem('manualRate',rate.value)});
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{amount.value=b.dataset.v;calc()}));
async function updateRate(){status.textContent='Lade aktuellen Referenzkurs…';try{const res=await fetch('https://api.frankfurter.dev/v1/latest?base=CNY&symbols=CHF',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const r=data.rates.CHF;if(!(r>0))throw Error('Kurs fehlt');rate.value=String(r);localStorage.setItem('cachedRate',String(r));localStorage.setItem('cachedDate',data.date);localStorage.removeItem('manualRate');status.textContent='Aktueller Referenzkurs vom '+data.date;calc()}catch(e){const cached=localStorage.getItem('cachedRate');if(cached&&!localStorage.getItem('manualRate'))rate.value=cached;status.textContent=localStorage.getItem('manualRate')?'Manuell eingestellter Kurs aktiv.':'Offline: gespeicherter Kurs vom '+(localStorage.getItem('cachedDate')||'letzten Abruf')+'.';calc()}}
const manual=localStorage.getItem('manualRate');if(manual)rate.value=manual;calc();updateRate();document.querySelector('#refresh').addEventListener('click',updateRate);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
